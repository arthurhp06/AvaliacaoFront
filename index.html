<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Login</title>
    <link rel="stylesheet" href="/styles/index.css">
</head>
<body>
   <main class="login-container">
    <div class="login-card">
        <h2>Faça seu Login.</h2>

        <form action="exercicio.html" method="get">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seuemail@exemplo.com">
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="********">
            </div>
            <div class="forgot-password">
                <a href="#">Esqueci minha senha</a>
            </div>
            <button type="submit" class="btn-entrar">Entrar</button>
            <div class="signup-link">
                <a href="/sobre.html">Ainda não tenho uma conta</a>
            </div>

        </form>
    </div>
    <div class="gradient-side"></div>
   </main>
</body>
</html>
