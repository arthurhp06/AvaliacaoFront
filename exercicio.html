<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Exercicio</title>
    <link rel="stylesheet" href="styles/exercicio.css">
</head>
<body>
    <main class="exercicio-container">
        <div class="exercicio-card">
            <h2>Calculadora de Operações</h2>
            <div class="input-group">
                <label for="num1">Primeiro Número</label>
                <input type="number" id="num1" placeholder="Digite o primeiro número">
            </div>
            <div class="input-group">
                <label for="num2">Segundo Número</label>
                <input type="number" id="num2" placeholder="Digite o segundo número">
            </div>
            <button id="btnCalcular" class="btn-calcular">Calcular Operações</button>
            <div id="resultados" class="resultados-grid">
                <p class="placeholder-text">Informe os valores e clique em calcular para exibir os resultados.</p>
            </div>
            <div class="nav-links">
                <a href="index.html">Voltar ao Login</a>
                <span>°</span>
                <a href="sobre.html">Sobre</a>
            </div>
        </div>
        <div class="gradient-side">
            <div class="banner-content">
                <h1>cálculos em Tempo Real</h1>
                <p>Soma, subtração, multiplicação e divisão processadas instantaneamente via JavaScript.</p>
            </div>
        </div>
    </main>
    <script src="script/exercicio.js"></script>
</body>
</html>
